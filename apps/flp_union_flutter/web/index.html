<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Telangana Authorised Service Centre Proprietors Welfare Society workforce management platform.">

  <!-- PWA Theme Color -->
  <meta name="theme-color" content="#111315">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111315">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#111315">

  <!-- Mobile & iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TASPU">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png" type="image/png">

  <!-- Title & Web App Manifest -->
  <title>TASPU</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #111315;
      color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, #20272D 0%, #111315 100%);
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    }

    .loading-emblem {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      margin-bottom: 24px;
      object-fit: cover;
    }

    .loading-spinner {
      width: 26px;
      height: 26px;
      border: 2.5px solid rgba(108, 140, 255, 0.2);
      border-top-color: #6C8CFF;
      border-radius: 50%;
      animation: taspu-spin 0.8s linear infinite;
    }

    @keyframes taspu-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(function (reg) {
            console.log('[TASPU PWA] Service Worker registered with scope:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[TASPU PWA] Service Worker registration failed:', err);
          });
      });
    }
  </script>
</head>
<body>
  <div id="loading-container" aria-label="Loading TASPU">
    <img class="loading-emblem" src="icons/Icon-192.png" alt="TASPU Society Logo" width="88" height="88">
    <div class="loading-spinner" role="status" aria-label="Loading application"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
